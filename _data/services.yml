# Tiles on the home page. Order here is display order.
#
# fields:
#   name  — tile label, bottom-left of the tile (required)
#   url   — where the tile links (required)
#   logo  — name of an svg in _includes/icons/ (drop new ones in there,
#           single-path monochrome svgs from https://simpleicons.org work as-is)
#   img   — full-color raster icon: filename in assets/icons/, shown as-is
#   icon  — fallback: a single character/emoji, used when no logo/img is set
#   desc  — short description; shown on wide tiles and as hover tooltip
#   size  — square (default) or wide
#   color — pink (default), mauve, lavender, teal, orange, green, surface,
#           or white (near-black in mocha / near-white in latte)
#   wordmark — true if the logo is wide text (renders in a wider box)
#   mark      — true if the logo is a square glyph that should render larger
#               than the default icon size (as opposed to a wordmark)

- name: do
  url: https://do.foid.space
  logo: kaneo
  wordmark: true
  size: wide
  color: white

- name: git
  url: https://git.foid.space
  logo: forgejo
  desc: forgejo
  color: pink

- name: opal
  url: https://opal.foid.space
  logo: opal
  mark: true
  size: wide
  color: orange

- name: money
  url: https://money.foid.space
  logo: sure
  desc: sure
  color: green

- name: chat
  url: https://chat.foid.space
  logo: xmpp
  desc: fluux
  color: lavender

- name: wiki
  url: https://wiki.foid.space
  logo: outline
  desc: outline
  color: mauve

- name: auth
  url: https://auth.foid.space
  logo: pocketid
  desc: pocket id
  color: green

- name: do (legacy)
  url: https://do-legacy.foid.space
  logo: plane
  desc: plane
  color: white

- name: updog
  url: https://updog.foid.space
  img: updog.png
  desc: what's updog
  color: surface
